files: "(console_conf|subiquity|subiquitycore|vmtests|doc)"
repos:
  - repo: https://github.com/psf/black
    rev: 258e7dbf348bc23cb70b8cdf693481c04634ebcc  # 26.10.1
    hooks:
      - id: black
        files: "(console_conf|subiquity|subiquitycore|vmtests)"
  - repo: https://github.com/pycqa/isort
    rev: 9f905615631c545f5aea2516508109350d1d2f7d  # 9.0.2
    hooks:
      - id: isort
        name: isort
        files: "(console_conf|subiquity|subiquitycore|vmtests)"
  - repo: local
    hooks:
      - id: doc-spelling
        name: doc-spelling
        language: system
        entry: make -C doc spelling
        files: "doc/.*rst"
        pass_filenames: false
