name: TICS

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 6'  # Run at 5:17a (arbitrary) on Saturday

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  TICS:
    runs-on: [self-hosted, linux, amd64, tiobe, noble]
    steps:
      - name: Checkout the project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Dependencies
        run: |
          sudo ./scripts/installdeps.sh

      - name: Coverage
        run: |
          make coverage

      - name: Run TICS analysis with github-action
        uses: tiobe/tics-github-action@016a4d79f3027fe7b4a2901619a58c745ab7cadf  # v3
        with:
          mode: qserver
          project: subiquity
          branchdir: .
          viewerUrl: https://canonical.tiobe.com/tiobeweb/TICS/api/cfg?name=default
          ticsAuthToken: ${{ secrets.TICSAUTHTOKEN }}
          installTics: true
